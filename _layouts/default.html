<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% assign seo_title = page.seo_title | default: page.title %}
  {% assign seo_description = page.description | default: site.description %}
  <title>{{ seo_title | escape }}</title>
  <meta name="description" content="{{ seo_description | escape }}">
  <link rel="canonical" href="https://yatongchen0603.github.io{{ page.canonical_path | default: page.url }}">
  <meta property="og:title" content="{{ seo_title | escape }}">
  <meta property="og:description" content="{{ seo_description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yatongchen0603.github.io{{ page.canonical_path | default: page.url }}">
  <meta property="og:site_name" content="Yatong Chen (陈雅童)">
  {% if page.navbar_title == "Home" %}
  <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "WebSite", "name": "Yatong Chen (陈雅童)", "url": "https://yatongchen0603.github.io/"}, {"@type": "Person", "name": "Yatong Chen", "alternateName": "陈雅童", "url": "https://yatongchen0603.github.io/", "jobTitle": "Ph.D. candidate", "affiliation": {"@type": "CollegeOrUniversity", "name": "Shanghai Jiao Tong University"}, "sameAs": ["https://github.com/YatongChen0603", "https://orcid.org/0000-0002-8954-9109", "https://scholar.google.com/citations?user=fFAiWTYAAAAJ"]}]}</script>
  {% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
</head>
<body>
  {% include navbar.html %}
  <main class="site-shell" id="main-content">{{ content }}</main>
  {% include footer.html %}
</body>
</html>
