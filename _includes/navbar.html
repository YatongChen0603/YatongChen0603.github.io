<header class="site-header">
  <nav class="site-shell navigation" aria-label="Main navigation">
    <a class="wordmark" href="{{ '/' | relative_url }}">Yatong Chen</a>
    <div class="nav-links">
      {% for item in site.data.navigation.pages %}
      <a href="{{ item.url | relative_url }}" {% if item.name == page.navbar_title %}class="active" aria-current="page"{% endif %}>{{ item.name }}</a>
      {% endfor %}
    </div>
  </nav>
</header>
