{% assign news = site.news | sort: "date" | reverse %}
<section class="section news" aria-labelledby="news-title">
  <div class="section-heading"><h2 id="news-title">News</h2></div>
  <ul class="news-list">
    {% for item in news limit:include.limit %}
    <li><time datetime="{{ item.date | date: '%Y-%m-%d' }}">{{ item.date | date: "%b %Y" }}</time><div>{{ item.title }}</div></li>
    {% endfor %}
  </ul>
</section>
