<aside class="profile">

  <h1>Yatong Chen <span lang="zh">陈雅童</span></h1>
  <p class="profile-role">Ph.D. candidate</p>
  <p class="affiliation">Shanghai Jiao Tong University</p>
  <a class="email" href="mailto:{{ site.data.profile.email }}">{{ site.data.profile.email }}</a>
  <div class="profile-links">

    <a href="https://orcid.org/{{ site.data.profile.orcid }}" target="_blank" rel="noopener">ORCID</a>
